[project]
lang = "ts"
pkg  = "shenguard"

[paths]
spec = "specs/core.shen"

[engine]
relaxed = false

# Gate topology — declared explicitly via the [[gates]] array of
# tables (Wave-1 manifest format). For TypeScript projects the
# default test runner is `npm test` and the default build is
# `npx tsc --noEmit`. The auto-appended shen-derive gate runs after
# these.

[[gates]]
name = "shengen"
kind = "command"
run  = "./bin/shengen-codegen.sh"

[[gates]]
name = "test"
kind = "command"
run  = "npm test"

[[gates]]
name = "build"
kind = "command"
run  = "npx tsc --noEmit"

[[gates]]
name = "shen-check"
kind = "command"
run  = "./bin/shen-check.sh"

[[gates]]
name = "tcb-audit"
kind = "command"
# tcb-audit drift-checks the committed runtime/guards_gen.ts against a fresh
# regen from specs/core.shen. The --no-isolation-check flag is necessary
# because the TS guards live in the shared runtime/ directory alongside
# hand-written code (bridge.ts, ui.ts, etc.); the directory is not a
# dedicated package the way internal/shenguard/ is in the Go examples.
run  = "../../bin/shenguard-audit.sh --lang ts --no-isolation-check specs/core.shen shenguard runtime/guards_gen.ts"

# Gate 5+ — flow premises over a resolved symbol graph (W3).
#
# Identical in shape to the Go example's flow gate: `sb flow` runs
# `sb index`, which picks scip-typescript for a lang="ts" project, and
# evaluates the (flow ...) forms in specs/core.shen over the resulting
# facts. The premise text is the same in both examples — only the
# indexer differs.
#
# No `run` field: this example never had a grep gate for the raw
# constructors, so there is nothing to fall back to. Without a SCIP
# indexer on PATH the premises are simply recorded unproven with basis
# "grep-fallback" and the gate passes, which is the honest outcome.
# See ../../docs/FLOW.md.
[[gates]]
name = "flow"
kind = "flow"

# Gate 6 — spec-equivalence verification via shen-derive-ts.
#
# Each [[derive.specs]] entry pins one hand-written TS implementation
# to a Shen spec. `sb derive` regenerates the committed test file, diffs
# it against the committed copy (drift gate), then runs the test.
[derive]

[[derive.specs]]
lang      = "ts"
path      = "specs/tag-block-resolver.shen"
func      = "resolve-tag-block-children"
impl_pkg  = "./tag_resolver.js"
impl_func = "ResolveTagBlockChildren"
guard_pkg = "./guards_gen.js"
out_file  = "runtime/tag_resolver.shen-derive.test.ts"
