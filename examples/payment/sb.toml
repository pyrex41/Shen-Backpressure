[project]
lang = "go"
pkg  = "shenguard"
# GDP brands (W1): generated proof types carry a phantom brand parameter
# binding each proof to the value it is about, plus an unexported witness
# that makes an empty-literal forgery panic on first read. `sb gen` passes
# --brands; the tcb-audit gate below passes it too (see
# bin/shenguard-audit.sh), so the drift check compares like with like.
brands = true

[paths]
spec   = "specs/core.shen"
output = "internal/shenguard/guards_gen.go"

[engine]
relaxed = false

# The Shen host for gate 4 (tc+) and for the Shen flow engine (W6).
# `make shen-go` at the repo root builds the Go port to bin/shen; this
# line points at it so the gate does not depend on PATH. $SHEN still
# overrides it. With no host at all, gate 4 skips and the discharge
# report records tc+ as UNVERIFIED rather than passed.
[shen]
bin = "../../bin/shen"

# Gate topology — declared explicitly via the [[gates]] array of
# tables (Wave-1 manifest format). Same five gates the engine would
# synthesise from convention defaults; spelling them out here
# dogfoods the recommended format and lets future projects diverge
# (different test runner, an extra lint gate, a parallel group)
# without touching the engine. The [[derive.specs]] block at the
# bottom auto-appends a sixth shen-derive gate.

[[gates]]
name = "shengen"
kind = "command"
run  = "./bin/shengen-codegen.sh"

[[gates]]
name = "test"
kind = "command"
run  = "go test ./..."

[[gates]]
name = "build"
kind = "command"
run  = "go build ./..."

[[gates]]
name = "shen-check"
kind = "command"
run  = "./bin/shen-check.sh"

[[gates]]
name = "tcb-audit"
kind = "command"
run  = "./bin/shenguard-audit.sh"

# Gate 5+ — the forgery corpus (W4).
#
# Every *.go.bak under forgeries/ declares the outcome it expects in a
# header line, and `sb forgery` runs the check that expectation names.
# This example's corpus is three `derive-catch` forgeries: each one
# stands in for internal/derived/processable.go and the gate asserts
# that the committed spec test rejects it.
#
# They were the demo-shen-derive bug files, run by hand from
# demo-shen-derive/run.sh. Standing them up as a gate is the point of
# W4: a bug the behavioral gate is *claimed* to catch and a bug it is
# *measured* to catch are different claims, and only the second one
# survives a refactor. `sb mutate` measures the same gate over a
# generated operator set; these three are the hand-picked cases whose
# stories are worth telling in prose.
[[gates]]
name = "forgery"
kind = "forgery"

[forgery]
dir   = "forgeries"
stage = "internal/forgery_harness"

# Gate 6 — spec-equivalence verification via shen-derive.
#
# For each [[derive.specs]] entry, `sb derive` regenerates the
# table-driven Go test that asserts the implementation matches the
# Shen spec, diffs it against the committed copy, and fails on drift.
# After all drift checks pass, `sb derive` runs `go test` on each
# referenced implementation package.
#
# `sb derive --regen` rewrites the OutFile instead of diffing.
[derive]
dir = "../../shen-derive"

# W2 — path-complete sampling. shen-derive symbolically executes each
# (define …), enumerates every path (unrolling list recursion to
# `path_depth`), and asks Z3 for one concrete input per feasible path.
# Those inputs are committed alongside the boundary pool, and the
# generated test's header records paths_total / paths_feasible /
# paths_dead.
#
# Needs a `z3` binary on PATH (`pip install z3-solver` provides one).
# Without z3 shen-derive still works — it enumerates the paths, reports
# feasibility as unknown, and falls back to the boundary pool, saying so
# in the header — but the file it generates then has 35 cases instead of
# 44, so the drift check will flag the committed copy as stale. A CI
# runner for this example therefore needs z3, which is the price of
# committing path witnesses. Drop these two lines to opt back out.
path_cover = true
path_depth = 4

[[derive.specs]]
path      = "specs/core.shen"
func      = "processable"
impl_pkg  = "ralph-shen-agent/internal/derived"
impl_func = "Processable"
guard_pkg = "ralph-shen-agent/internal/guardcompat"
out_file  = "internal/derived/processable_spec_test.go"
