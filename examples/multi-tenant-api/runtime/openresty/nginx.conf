# nginx.conf — Shen policy enforcement INSIDE nginx (OpenResty).
#
# The spec (specs/core.shen) is the runtime policy: each request to
# /api/<tenant>/<resource> is authorized by the Shen kernel's typechecker
# deciding whether the request's ground term inhabits `resource-access`.
# No sidecar, no lowering — the kernel boots once per worker (~30 ms warm)
# and each check is ~1 ms of pure CPU inside the access phase (~1000
# kernel inferences, full proof chain).
#
# Run via ./demo.sh (it sets the env vars and the prefix dir).

worker_processes 1;
daemon off;
error_log stderr notice;
pid nginx.pid;

# pass the shen-lua location + cache path through to the Lua VM
env SHEN_LUA_DIR;
env SHEN_KERNEL_CACHE;
env SB_SPEC;

events { worker_connections 64; }

http {
    access_log off;

    init_by_lua_block {
        -- Boot the kernel + load the spec ONCE in the master; workers fork
        -- with the booted state copy-on-write.
        local conf = os.getenv("SB_CONF_DIR") or "."
        package.path = conf .. "/../shen-lua/?.lua;" .. package.path
        sb = require("sb_policy").init{ spec = os.getenv("SB_SPEC") }

        -- The data plane: facts the kernel takes as ground premises. In a
        -- real deployment these come from your store; the kernel's job is
        -- the JUDGMENT (the proof chain), not the lookup.
        members = {                       -- tenant -> set of user ids
            t1 = { u1 = true, u2 = true },
            t2 = { u3 = true },
        }
        owns = {                          -- resource -> owning tenant
            r1 = "t1", r2 = "t2",
        }
    }

    server {
        listen 127.0.0.1:8127;

        # GET /api/<tenant>/<resource>  with  X-User: <id>
        location ~ "^/api/([\w-]+)/([\w-]+)$" {
            access_by_lua_block {
                local tenant, resource = ngx.var[1], ngx.var[2]
                local user = ngx.req.get_headers()["X-User"]
                if not user or user == "" then
                    ngx.status = 401
                    ngx.say('{"error":"missing X-User header"}')
                    return ngx.exit(401)
                end

                -- facts from the data plane
                local isMember = (members[tenant] or {})[user] == true
                local isOwned  = owns[resource] == tenant

                -- the judgment: does [[principal tenant isMember] resource isOwned]
                -- inhabit resource-access?  (kernel typechecker, full proof chain)
                local t0 = os.clock()   -- CPU time, us resolution (ngx.now is ms-cached)
                local ok = sb.allow("resource", user, tenant, resource, isMember, isOwned)
                ngx.ctx.policy_us = math.floor((os.clock() - t0) * 1e6)

                if not ok then
                    ngx.status = 403
                    ngx.header["X-Policy-Us"] = ngx.ctx.policy_us
                    ngx.say(string.format(
                        '{"allowed":false,"user":%q,"tenant":%q,"resource":%q,"is_member":%s,"is_owned":%s}',
                        user, tenant, resource, tostring(isMember), tostring(isOwned)))
                    return ngx.exit(403)
                end
            }

            content_by_lua_block {
                ngx.header["X-Policy-Us"] = ngx.ctx.policy_us
                ngx.say(string.format(
                    '{"allowed":true,"user":%q,"tenant":%q,"resource":%q,"proof":"resource-access","policy_us":%d}',
                    ngx.req.get_headers()["X-User"], ngx.var[1], ngx.var[2], ngx.ctx.policy_us or -1))
            }
        }

        location = /healthz {
            content_by_lua_block { ngx.say("ok") }
        }

        # diagnostic: run the boot self-tests in the WORKER (post-fork)
        location = /selftest {
            content_by_lua_block {
                local cases = {
                    {"tenant",   "u1", "t1", "",   true,  false, true},
                    {"tenant",   "u1", "t1", "",   false, false, false},
                    {"resource", "u1", "t1", "r1", true,  true,  true},
                    {"resource", "u1", "t1", "r1", true,  false, false},
                }
                local out = {}
                for i, c in ipairs(cases) do
                    local got = sb.allow(c[1], c[2], c[3], c[4], c[5], c[6])
                    out[#out+1] = string.format("%d: want=%s got=%s %s",
                        i, tostring(c[7]), tostring(got), got == c[7] and "OK" or "FAIL")
                end
                ngx.say(table.concat(out, "\n"))
            }
        }



        # diagnostic: tight in-worker bench (isolates per-request overhead
        # from kernel/JIT degradation inside the worker)
        location = /bench {
            content_by_lua_block {
                local N = 2000
                local t0 = os.clock()
                for i = 1, N do
                    sb.allow("resource", "u1", "t1", "r1", true, true)
                end
                local us = (os.clock() - t0) / N * 1e6
                ngx.say(string.format('{"in_worker_us_per_check":%.1f,"jit_status":%s}',
                                       us, tostring(require("jit").status())))
            }
        }
    }
}
