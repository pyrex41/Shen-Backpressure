# Shen-Backpressure manifest for the multi-tenant-api example.
#
# Declares the gate topology explicitly via the [[gates]] array of
# tables (Wave-1 manifest format). These are the same five gates the
# engine would otherwise synthesise from convention defaults — spelling
# them out here lets `sb gates` / `sb loop` read the pipeline straight
# from the manifest instead of relying on path conventions.

[project]
lang = "go"
pkg  = "shenguard"
# GDP brands (W1): generated proof types carry a phantom brand parameter
# binding each proof to the value it is about, plus an unexported witness
# that makes an empty-literal forgery panic on first read. `sb gen` passes
# --brands; the tcb-audit gate below passes it too (see
# bin/shenguard-audit.sh), so the drift check compares like with like.
brands = true

[paths]
spec   = "specs/core.shen"
output = "internal/shenguard/guards_gen.go"

[engine]
relaxed = false

[[gates]]
name = "shengen"
kind = "command"
run  = "./bin/shengen-codegen.sh"

[[gates]]
name = "test"
kind = "command"
run  = "go test ./..."

[[gates]]
name = "build"
kind = "command"
run  = "go build ./..."

[[gates]]
name = "shen-check"
kind = "command"
run  = "./bin/shen-check.sh"

[[gates]]
name = "tcb-audit"
kind = "command"
run  = "./bin/shenguard-audit.sh"

# Gate 5+ — flow premises over a resolved symbol graph (W3).
#
# Kind "flow" is served by `sb flow`: it runs `sb index` (scip-go here,
# cached by tree hash under .sb/), evaluates every (flow ...) form in
# specs/core.shen, and records each premise in the discharge report —
# discharged with basis "flow-analysis", or violated with the file:line
# of the offending reference and the shortest violating path.
#
# The `run` field of a flow gate is NOT the gate: it is the legacy grep
# to fall back to when no SCIP indexer is on PATH. In that case the
# premises are recorded unproven with basis "grep-fallback", so the
# report is honest about the fact that a regex ran instead of an
# analysis. Step 1 of bin/shenguard-audit.sh is that grep, and
# --grep-only runs it alone.
#
# The fixed five-gate shape above is untouched; this is an additional
# manifest gate. See ../../docs/FLOW.md.
[[gates]]
name = "flow"
kind = "flow"
run  = "./bin/shenguard-audit.sh --grep-only"

# Gate 6 — spec-equivalence verification via shen-derive.
#
# Anchors the discharge report on the trivial `same-user?`
# oracle (a one-line wrapper-unwrap predicate). Without this entry
# `sb derive` has no rules to classify and produces an empty report.
# The wider goal is to get every datatype in specs/core.shen
# enumerated in transcript/discharge_report.json with its `static`
# discharge classification — including the W2.1 cross-field premise
# `(= User (head (head Jwt)))` inside `authenticated-user`.
#
# See specs/core.shen for the doc comment explaining why this is the
# simplest possible derive anchor (shen-derive's sampler doesn't yet
# filter guarded composites like parsed-claims, so we anchor on a
# wrapper input).
[derive]
dir = "../../shen-derive"

[[derive.specs]]
path      = "specs/core.shen"
func      = "same-user?"
impl_pkg  = "multi-tenant-api/internal/derived"
impl_func = "SameUser"
guard_pkg = "multi-tenant-api/internal/shenguard"
out_file  = "internal/derived/same_user_spec_test.go"

# Gate 6+ — runtime policy emission for Cedar (SMT tier) + Rego (middle terminating tier).
#
# `sb context` surfaces both under .cedar / .rego (and markdown sections).
# `sb policy` (and auto "shen-cedar" + "shen-rego" gates) run the respective
# emitters. --regen writes committed; otherwise drift detection (tempfile diff).
#
# Cedar uses JSON schema/policies (cedar validate/authorize).
# Rego uses primary .rego text (opa eval / conftest). Same targets for n-way diff.
[cedar]
schema_out   = "policies/cedar/schema.json"
policies_out = "policies/cedar/policies.json"
targets      = ["tenant-access", "resource-access"]

[rego]
module_out = "policies/rego/authz.rego"
targets    = ["tenant-access", "resource-access"]
package    = "multi_tenant_authz"

# Decidable-Shen-fragment tier (native-Shen but terminating "decidable" runtime policy).
# Parallel to [cedar]; uses @decidable-fragment annotations in specs (or targets).
# `sb policy --decidable` (and the "shen-decidable" gate) runs the tiny recognizer/check/cert
# inside shen-cedar + the pure-shen-fragment-eval stub for differential n-way.
# At a Shen port (shen-go etc) the certified restricted rules can be embedded directly.
[decidable-shen]
targets = ["tenant-access", "resource-access"]

[loop]
harness = "claude -p"
